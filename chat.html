<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Doc Analyzer</title>
    <style>
        :root { --bg: #0d1117; --surface: #161b22; --border: #30363d;
            --text: #c9d1d9; --muted: #8b949e; --accent: #f59e0b; --green: #3fb950;
            --red: #f85149; --radius: 8px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text);
            height: 100vh; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; }
        header { padding: 14px 20px; border-bottom: 1px solid var(--border);
            background: var(--surface); display: flex; align-items: center; gap: 16px; }
        header h1 { font-size: 1em; }
        header .tabs { display: flex; gap: 4px; margin-left: auto; }
        header .tab { padding: 6px 14px; border-radius: 6px; font-size: 0.8em; cursor: pointer;
            border: 1px solid var(--border); background: transparent; color: var(--muted); }
        header .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
        #panels { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .panel { display: none; flex: 1; overflow-y: auto; padding: 20px; }
        .panel.active { display: flex; flex-direction: column; }

        /* Chat */
        #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .msg { padding: 10px 14px; border-radius: var(--radius); max-width: 90%; line-height: 1.6; font-size: 0.9em; }
        .msg.user { background: #1f6feb22; align-self: flex-end; border: 1px solid #1f6feb44; }
        .msg.bot { background: var(--surface); align-self: flex-start; border: 1px solid var(--border); }
        .msg .meta { font-size: 0.7em; color: var(--muted); margin-bottom: 4px; }
        .msg .source { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border);
            font-size: 0.75em; color: var(--muted); }
        .chat-foot { padding: 10px 0; display: flex; gap: 8px; }
        .chat-foot input { flex: 1; padding: 10px 14px; background: var(--bg);
            border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); outline: none; }
        .chat-foot input:focus { border-color: var(--accent); }
        .chat-foot button { padding: 10px 20px; background: var(--accent); color: #000;
            border: none; border-radius: var(--radius); font-weight: 600; cursor: pointer; }

        /* Upload */
        #dropzone { border: 2px dashed var(--border); border-radius: var(--radius);
            padding: 40px; text-align: center; color: var(--muted); cursor: pointer; transition: .2s; }
        #dropzone:hover, #dropzone.drag { border-color: var(--accent); color: var(--accent); }
        #fileList { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
        .file-row { padding: 8px 12px; background: var(--surface); border-radius: 4px;
            display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; }
        .file-row .ok { color: var(--green); }
        .file-row .err { color: var(--red); }

        /* Docs */
        .doc-row { padding: 10px 14px; background: var(--surface); border-radius: 4px;
            margin-bottom: 8px; display: flex; justify-content: space-between; font-size: 0.85em; }
        .doc-row .type { color: var(--accent); font-size: 0.75em; }

        pre { background: #00000033; border-radius: 4px; padding: 8px; overflow-x: auto; margin: 6px 0; font-size: 0.85em; }
    </style>
</head>
<body>
    <header>
        <h1>📄 Smart Doc Analyzer</h1>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('chat')">💬 聊天</button>
            <button class="tab" onclick="switchTab('upload')">📤 上传</button>
            <button class="tab" onclick="switchTab('docs')">📋 文档</button>
        </div>
    </header>

    <div id="panels">
        <!-- Chat Panel -->
        <div id="panel-chat" class="panel active">
            <div id="chat">
                <div class="msg bot">
                    <div class="meta">🤖 助手</div>
                    你好！上传文档后即可提问。试试问「这份合同的关键条款是什么？」
                </div>
            </div>
            <div class="chat-foot">
                <input id="q" type="text" placeholder="输入问题..." onkeydown="if(event.key==='Enter')chat()">
                <button id="btn" onclick="chat()">发送</button>
            </div>
        </div>

        <!-- Upload Panel -->
        <div id="panel-upload" class="panel">
            <div id="dropzone" onclick="document.getElementById('fileInput').click()">
                📁 点击选择文件，或拖拽到此区域<br>
                <small>支持 PDF · DOCX · XLSX</small>
            </div>
            <input type="file" id="fileInput" accept=".pdf,.docx,.xlsx" multiple hidden onchange="uploadFiles(this.files)">
            <div id="fileList"></div>
        </div>

        <!-- Docs Panel -->
        <div id="panel-docs" class="panel">
            <div id="docList"></div>
        </div>
    </div>

    <script>
        const API = '';

        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelector(`.tab:nth-child(${{chat:1,upload:2,docs:3}[name]})`).classList.add('active');
            document.getElementById(`panel-${name}`).classList.add('active');
            if (name === 'docs') loadDocs();
        }

        // ── Chat ──
        async function chat() {
            const input = document.getElementById('q'), btn = document.getElementById('btn'),
                  box = document.getElementById('chat');
            const q = input.value.trim();
            if (!q) return;
            box.appendChild(el('div', 'msg user', '<div class="meta">👤 你</div>' + esc(q)));
            input.value = ''; btn.disabled = true;
            const load = el('div', 'msg bot', '⏳ 检索 + AI 思考中...');
            box.appendChild(load); box.scrollTop = box.scrollHeight;
            try {
                const r = await fetch(`${API}/api/v1/documents/qa`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query: q, top_k: 3})
                });
                if (!r.ok) { load.innerHTML = `❌ 服务器错误 (${r.status})`; btn.disabled = false; return; }
                const d = await r.json();
                load.remove();
                let html = '<div class="meta">🤖 AI 回答</div>' + fmt(d.answer || '未找到相关内容');
                if (d.snippets && d.snippets.length) {
                    html += '<div class="source">📎 参考来源：';
                    d.snippets.forEach((s,i) => html += `<div>[${i+1}] [${s.score?.toFixed(2)}] ${esc(s.source)} — ${esc(s.text)}...</div>`);
                    html += '</div>';
                }
                box.appendChild(el('div', 'msg bot', html));
            } catch(e) { load.innerHTML = '❌ 请求失败: ' + e.message; }
            btn.disabled = false; box.scrollTop = box.scrollHeight;
        }

        // ── Upload ──
        const dz = document.getElementById('dropzone');
        dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
        dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
        dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); uploadFiles(e.dataTransfer.files); });

        async function uploadFiles(files) {
            const list = document.getElementById('fileList');
            for (const f of files) {
                const row = el('div', 'file-row', `⏳ ${f.name} — 上传中...`);
                list.prepend(row);
                try {
                    const fd = new FormData(); fd.append('file', f);
                    const r = await fetch(`${API}/api/v1/documents/upload`, { method: 'POST', body: fd });
                    const d = await r.json();
                    row.innerHTML = `✅ ${f.name} <span class="ok">${d.chunk_count} 切片 · 入库完成</span>`;
                } catch(e) {
                    row.innerHTML = `❌ ${f.name} <span class="err">上传失败</span>`;
                }
            }
        }

        // ── Docs ──
        async function loadDocs() {
            const list = document.getElementById('docList');
            try {
                const r = await fetch(`${API}/api/v1/documents`);
                const d = await r.json();
                if (!d.items || !d.items.length) { list.innerHTML = '<p style="color:var(--muted)">暂无文档，请先上传</p>'; return; }
                list.innerHTML = d.items.map(i =>
                    `<div class="doc-row">
                        <span>📄 ${esc(i.filename)}<span class="type"> · ${i.file_type?.toUpperCase()}</span></span>
                        <span>${i.chunk_count ?? '?'} 切片</span>
                    </div>`
                ).join('');
            } catch(e) { list.innerHTML = '❌ 加载失败'; }
        }

        // ── utils ──
        function el(tag, cls, html) { const e = document.createElement(tag); e.className = cls; e.innerHTML = html; return e; }
        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function fmt(t) { return esc(t).replace(/```(\w+)?\n([\s\S]*?)```/g,'<pre>$2</pre>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
    </script>
</body>
</html>
