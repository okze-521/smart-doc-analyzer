services:
  app:
    build: .
    ports:
      - "9876:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/smart_doc.db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - EMBEDDING_MODEL=/app/models/bge-small
      - EMBEDDING_DIM=512
      - RERANKER_MODEL=/app/models/bge-reranker-v2-m3
      - LLM_PROVIDER=ollama
      - OLLAMA_HOST=http://192.168.3.200:11434
      - OLLAMA_MODEL=qwen3.6:35b-a3b-q4_K_M
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - app_data:/app/data
      - app_uploads:/app/uploads
      - ./models/models/AI-ModelScope--bge-small-zh-v1.5/snapshots/master:/app/models/bge-small:ro
      - ./models/bge-reranker-v2-m3:/app/models/bge-reranker-v2-m3:ro
    depends_on:
      - qdrant
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:v1.8.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET / HTTP/1.0\r\n\r\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app_data:
  app_uploads:
  qdrant_data:
