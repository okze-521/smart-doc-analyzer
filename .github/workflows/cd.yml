name: Build & Deploy

on:
  push:
    branches: [main]

# 环境变量
env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/smart-doc-analyzer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 等 CI 测试通过后再跑（CI 定义在上面）
    # needs: test   # 取消注释可启用"测试通过才构建"
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 镜像摘要
        run: echo "📦 ${{ env.IMAGE_NAME }}:${{ github.sha }}"
