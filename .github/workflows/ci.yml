name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 运行测试
        run: pytest tests/ -v --tb=short

      - name: 代码检查
        run: |
          pip install ruff
          ruff check src/ || true
